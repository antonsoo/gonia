</metadata><title id="saved-hoist-title">Pentaspaston · five wheels; 5 supporting portions</title><desc id="saved-hoist-desc">The tied end moves with the load. Load rises 1 metres while 5 metres of rope wind onto the drum. Each marked supporting portion supplies 240 newtons upward. The wheels are unrolled sideways; this is a schematic.</desc><defs><marker id="saved-hoist-up" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#315f81" stroke-width="1.5"/></marker><marker id="saved-hoist-down" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#635483" stroke-width="1.5"/></marker></defs><text x="30" y="31" class="hw-heading">5 upward tensions support 1,200 N</text><text x="30" y="59" class="hw-small">Pentaspaston · five wheels; end tied to moving assembly</text><path d="M 90 92 H 570" class="hw-fixed"/><text x="92" y="84" class="hw-small">Fixed support</text><ellipse cx="163.6" cy="135.8" rx="36.6" ry="9.48" class="hw-wheel "/><circle cx="163.6" cy="135.8" r="3" class="hw-axle"/><path d="M 163.6 135.8 V 92" class="hw-frame "/><ellipse cx="246.8" cy="362" rx="36.6" ry="9.48" class="hw-wheel hw-moving"/><circle cx="246.8" cy="362" r="3" class="hw-axle"/><path d="M 246.8 362 V 391" class="hw-frame hw-load-frame"/><ellipse cx="330" cy="135.8" rx="36.6" ry="9.48" class="hw-wheel "/><circle cx="330" cy="135.8" r="3" class="hw-axle"/><path d="M 330 135.8 V 92" class="hw-frame "/><ellipse cx="413.20000000000005" cy="362" rx="36.6" ry="9.48" class="hw-wheel hw-moving"/><circle cx="413.20000000000005" cy="362" r="3" class="hw-axle"/><path d="M 413.20000000000005 362 V 391" class="hw-frame hw-load-frame"/><ellipse cx="496.4" cy="135.8" rx="36.6" ry="9.48" class="hw-wheel "/><circle cx="496.4" cy="135.8" r="3" class="hw-axle"/><path d="M 496.4 135.8 V 92" class="hw-frame "/><path d="M 110 469 H 466.8" class="hw-baseline"/><text x="620" y="475" text-anchor="end" class
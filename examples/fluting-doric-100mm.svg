<svg xmlns="http://www.w3.org/2000/svg" width="190mm" height="277mm" viewBox="0 0 190 277" role="img" aria-labelledby="print-title"><title id="print-title">Gonia · doric flute template at chosen model scale</title><rect width="190" height="277" fill="white"/><g fill="#27352f" font-family="Georgia,serif"><text x="10" y="13" font-size="6">The cut inside a column</text><text x="10" y="23" font-size="3.7">DORIC · groove chord 100 mm · depth 20.710678 mm</text><text x="10" y="31" font-size="3.2">Chosen model dimensions; source prescription, not a measured ancient column.</text></g><g transform="translate(45 178)"><rect x="0" y="-100" width="100" height="100" fill="none" stroke="#999" stroke-width=".18"/><circle cx="50" cy="-50" r="70.71067811865474" fill="none" stroke="#aaa" stroke-width=".18"/><path d="M0,0 H100" stroke="#999" stroke-width=".18" stroke-dasharray="1 1"/><path id="print-cut" d="M0,0 A70.710678,70.710678 0 0 0 100,0" fill="none" stroke="#27352f" stroke-width=".35"/><circle cx="0" cy="0" r=".6"/><circle cx="100" cy="0" r=".6"/></g><g fill="#27352f" font-family="Georgia,serif" font-size="3.3"><text x="10" y="226">Print at 100% / actual size. Check the bar before using the template.</text><path id="calibration" d="M10,234 V238 M10,236 H35 M35,234 V238" fill="none" stroke="#27352f" stroke-width=".3"/><text x="39" y="237">25 mm</text><text x="10" y="249">Vitruvius IV.3.9: twenty divisions; square and compass, or flat faces.</text><text x="10" y="258">Krohn edition (1912), p. 85. New drawing: Anton Soloviev, 2026, MIT.</text><text x="10" y="267">https://antonsoo.github.io/gonia/fluting.html</text></g></svg>
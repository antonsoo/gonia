</metadata><title id="saved-hoist-title">Trispastos · three wheels; 3 supporting portions</title><desc id="saved-hoist-desc">The tied end moves with the load. Load rises 1 metres while 3 metres of rope wind onto the drum. The upward tensions are 179.3358, 199.262, 221.4022 newtons. Hauling tension is 246.0025 newtons. The wheels are unrolled sideways; this is a schematic.</desc><defs><marker id="saved-hoist-up" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#315f81" stroke-width="1.5"/></marker><marker id="saved-hoist-down" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#635483" stroke-width="1.5"/></marker></defs><text x="30" y="31" class="hw-heading">3 upward tensions support 600 N</text><text x="30" y="59" class="hw-small">Trispastos · three wheels; end tied to moving assembly</text><path d="M 173.2 92 H 486.79999999999995" class="hw-fixed"/><text x="175.2" y="84" class="hw-small">Fixed support</text><ellipse cx="246.79999999999998" cy="135.8" rx="36.6" ry="9.48" class="hw-wheel "/><circle cx="246.79999999999998" cy="135.8" r="3" class="hw-axle"/><text x="266.79999999999995" y="113.80000000000001" text-anchor="middle" class="hw-wheel-number">1</text><path d="M 246.79999999999998 135.8 V 92" class="hw-frame "/><ellipse cx="330" cy="362" rx="36.6" ry="9.48" class="hw-wheel hw-moving"/><circle cx="330" cy="362" r="3" class="hw-axle"/><text x="350" y="340" text-anchor="middle" class="hw-wheel-number">2</text><path d="M 330 362 V 391" class="hw-frame hw-load-frame"/><ellipse cx="413.2" cy="135.8" rx="36.6" ry="9.48" class="hw-wheel "/><circle cx="413.2" cy="135.8" r="3" class="hw-axle"/><text x="433.2" y="113.80000000000001" text-anchor="middle" class="hw-wheel-number">3</text><path d="M 413.2 135.8 V 92" class="hw-frame "/><path d="M 193.2 469 H 383.59999999999997" class="hw-baseline"/><text x="620" y="475" text-anchor="end" class="hw-small">Start
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run verify:geometry
      - run: npm run verify:spacing
      - run: npm run verify:entasis
      - run: npm run verify:fluting
      - run: npm run verify:segments
      - run: npm run verify:transport
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser -- /tmp/gonia-browser-review.json
      - run: npm run test:spacing -- /tmp/gonia-spacing-review/browser.json
      - run: python3 scripts/spacing-oracle.py /tmp/gonia-spacing-review/browser.json
      - run: npm run test:entasis -- /tmp/gonia-entasis-review/browser.json
      - run: python3 scripts/entasis-oracle.py /tmp/gonia-entasis-review/browser.json
      - run: npm run test:fluting -- /tmp/gonia-fluting-review
      - run: python3 scripts/fluting-oracle.py /tmp/gonia-fluting-review/browser.json
      - run: npm run preview > /tmp/gonia-preview.log 2>&1 &
      - run: npm run test:segments -- http://127.0.0.1:4328/gonia/ /tmp/gonia-segments-review
      - run: python3 scripts/segments-oracle.py /tmp/gonia-segments-review/browser.json
      - run: npm run test:transport -- /tmp/gonia-transport
      - run: node --import tsx scripts/transport-cases.ts | python3 scripts/transport-oracle.py /tmp/gonia-transport/review.json
      - run: npm run verify:hoist
      - run: npm run test:hoist -- /tmp/gonia-hoist
      - run: npm run verify:hoist-files -- /tmp/gonia-hoist
      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - run: npm run verify:optics
      - run: npm run test:optics -- /tmp/gonia-optics
      - run: python3 scripts/optics-artifacts.py /tmp/gonia-optics
      - run: npm run verify:ledger
      - run: npm run test:ledger -- /tmp/gonia-ledger
      - run: node --import tsx scripts/ledger-cases.ts | python3 scripts/ledger-oracle.py /tmp/gonia-ledger
      - run: npm run verify:ledger-files -- /tmp/gonia-ledger
      - run: npm run verify:babylon
      - run: npm run test:babylon -- /tmp/gonia-babylon
      - run: python3 scripts/babylon-oracle.py --browser /tmp/gonia-babylon/review.json
      - run: npm run verify:babylon-files -- /tmp/gonia-babylon

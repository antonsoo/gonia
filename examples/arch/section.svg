<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" role="img" aria-labelledby="ar-svg-title ar-svg-desc">
<title id="ar-svg-title">An arch and its supports, with a trial contact path</title><desc id="ar-svg-desc">Modern 13-block symmetric equilibrium experiment; no tension, no sliding, unlimited compression. Joint resultants and pier-base overturning only. Not an ancient design rule or a structural safety assessment. All fourteen joint contacts fit. The base resultant is inside its base. H = 0.6548 W. Lengths in centreline half-spans.</desc>
